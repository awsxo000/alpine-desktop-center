      <stop offset="0" stop-color="#07162d"/>
      <stop offset="1" stop-color="#0c2446"/>
    </linearGradient>
    <radialGradient id="blue" cx="35%" cy="30%" r="80%">
      <stop offset="0" stop-color="#4b83ff"/>
      <stop offset="1" stop-color="#123a9e"/>
